name: Release

on:
  push:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: meettape-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
      NUGET_PACKAGES: ${{ github.workspace }}/dist/nuget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Determine version and reject existing or superseded releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $patch = [int]$env:GITHUB_RUN_NUMBER - 1
          if ($patch -lt 1) { throw 'Release version must be greater than the development version.' }
          $version = "0.0.$patch"
          $tag = "v$version"
          "MEETTAPE_VERSION=$version" >> $env:GITHUB_ENV
          "MEETTAPE_TAG=$tag" >> $env:GITHUB_ENV
          $tags = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases.' }
          if ($tags -contains $tag) { throw 'Release already exists; published versions/assets are immutable.' }
          $remoteTag = @(git ls-remote origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release tags.' }
          if ($remoteTag.Count -gt 0) { throw 'Tag already exists; refusing to reuse a version.' }
          foreach ($existing in $tags) {
            if ($existing -match '^v(\d+\.\d+\.\d+)$' -and [version]$Matches[1] -gt [version]$version) {
              "SKIP_RELEASE=true" >> $env:GITHUB_ENV
              Write-Output "Skipping superseded $tag."
              break
            }
          }

      - uses: actions/cache@v4
        if: env.SKIP_RELEASE != 'true'
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/**/*.csproj', 'tests/**/*.csproj', 'tools/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - uses: actions/cache@v4
        if: env.SKIP_RELEASE != 'true'
        with:
          path: dist/vpk
          key: ${{ runner.os }}-vpk-1.2.161
      - uses: actions/cache@v4
        if: env.SKIP_RELEASE != 'true'
        with:
          path: dist/downloads
          key: ${{ runner.os }}-ffmpeg-9.0-E6B54767A6065919
      - name: Install FFmpeg for software audio tests
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          ./tools/Get-FFmpeg.ps1
          (Join-Path $PWD 'dist/ffmpeg') >> $env:GITHUB_PATH

      - name: Run software and headless tests
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          dotnet test tests/MeetTape.Tests/MeetTape.Tests.csproj --configuration Release --filter 'Category!=Hardware&Category!=LongRunning&FullyQualifiedName!=MeetTape.Tests.JobTests.SchedulerProcessesOtherMeetingsWhileFirstMeetingWaitsForRetry' --logger 'trx;LogFileName=software.trx' --results-directory dist/test-results
          if ($LASTEXITCODE -ne 0) { throw 'Software tests failed.' }

      - name: Run isolated scheduler regression with bounded diagnostics
        if: env.SKIP_RELEASE != 'true' && !cancelled()
        shell: pwsh
        run: ./tools/Test-Scheduler.ps1

      - name: Run headless tests
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          dotnet test tests/MeetTape.UiTests/MeetTape.UiTests.csproj --configuration Release --logger 'trx;LogFileName=headless.trx' --results-directory dist/test-results
          if ($LASTEXITCODE -ne 0) { throw 'Headless tests failed.' }

      - uses: actions/upload-artifact@v4
        if: env.SKIP_RELEASE != 'true' && !cancelled()
        with:
          name: release-software-diagnostics
          retention-days: 7
          path: |
            dist/test-results/**/*.trx
            dist/screenshots/*.png

      - name: Build verified Velopack package with bundled FFmpeg
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath dist/vpk/vpk.exe)) {
            dotnet tool install vpk --version 1.2.161 --tool-path dist/vpk
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install pinned vpk.' }
          }
          ./tools/Build-Package.ps1 -Version $env:MEETTAPE_VERSION -VpkPath ./dist/vpk/vpk.exe

      - name: Publish one GitHub Release
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            'dist/releases/OriApps.MeetTape-win-Setup.exe#Windows installer - download to install',
            "dist/releases/OriApps.MeetTape-$env:MEETTAPE_VERSION-full.nupkg#Update package - used by the app",
            'dist/releases/releases.win.json#Update feed - used by the app'
          )
          $setupUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:MEETTAPE_TAG/OriApps.MeetTape-win-Setup.exe"
          $notes = @(
            '## Windows installation',
            '',
            "**[Download Windows installer]($setupUrl)**",
            '',
            'To install MeetTape, download only the installer linked above. FFmpeg and the .NET runtime are included.',
            '',
            '**Update files:** the `.nupkg` package and `releases.win.json` are used by the app for updates. You do not need to download them manually.',
            ''
          ) -join "`n"
          [IO.File]::WriteAllText('dist/release-notes.md', $notes, [Text.UTF8Encoding]::new($false))
          # Create exactly once. Never upload over an existing Release or clobber its assets.
          gh release create $env:MEETTAPE_TAG @files --draft --target $env:GITHUB_SHA --title "MeetTape $env:MEETTAPE_VERSION" --generate-notes --notes-file dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; no published asset is replaced.' }
          gh release edit $env:MEETTAPE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release remains draft; inspect it before a new publication attempt.' }
