name: Release

on:
  push:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: meettape-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Determine version and reject existing or superseded releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $patch = [int]$env:GITHUB_RUN_NUMBER - 1
          if ($patch -lt 1) { throw 'Release version must be greater than the development version.' }
          $version = "0.0.$patch"
          $tag = "v$version"
          "MEETTAPE_VERSION=$version" >> $env:GITHUB_ENV
          "MEETTAPE_TAG=$tag" >> $env:GITHUB_ENV
          $tags = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases.' }
          if ($tags -contains $tag) { throw 'Release already exists; published versions/assets are immutable.' }
          $remoteTag = @(git ls-remote origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release tags.' }
          if ($remoteTag.Count -gt 0) { throw 'Tag already exists; refusing to reuse a version.' }
          foreach ($existing in $tags) {
            if ($existing -match '^v(\d+\.\d+\.\d+)$' -and [version]$Matches[1] -gt [version]$version) {
              "SKIP_RELEASE=true" >> $env:GITHUB_ENV
              Write-Output "Skipping superseded $tag."
              break
            }
          }

      - name: Install FFmpeg for software audio tests
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Test FFmpeg installation failed.' }

      - name: Run software and headless tests
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          dotnet test tests/MeetTape.Tests/MeetTape.Tests.csproj --configuration Release --filter 'Category!=Hardware&Category!=LongRunning'
          if ($LASTEXITCODE -ne 0) { throw 'Software tests failed.' }
          dotnet test tests/MeetTape.UiTests/MeetTape.UiTests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Headless tests failed.' }

      - name: Build verified Velopack package with bundled FFmpeg
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        run: |
          dotnet tool install vpk --version 1.2.161 --tool-path dist/vpk
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install pinned vpk.' }
          ./tools/Build-Package.ps1 -Version $env:MEETTAPE_VERSION -VpkPath ./dist/vpk/vpk.exe

      - name: Publish one GitHub Release
        if: env.SKIP_RELEASE != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @('dist/releases/OriApps.MeetTape-win-Setup.exe', "dist/releases/OriApps.MeetTape-$env:MEETTAPE_VERSION-full.nupkg", 'dist/releases/releases.win.json')
          # Create exactly once. Never upload over an existing Release or clobber its assets.
          gh release create $env:MEETTAPE_TAG @files --draft --target $env:GITHUB_SHA --title "MeetTape $env:MEETTAPE_VERSION" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; no published asset is replaced.' }
          gh release edit $env:MEETTAPE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release remains draft; inspect it before a new publication attempt.' }
