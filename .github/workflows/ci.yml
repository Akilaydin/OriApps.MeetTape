name: CI

on:
  pull_request:
    branches:
      - main
      - release

permissions:
  contents: read

jobs:
  non-hardware-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install FFmpeg for audio tests
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed.' }
          ffmpeg -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg is not available on PATH.' }
          ffprobe -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe is not available on PATH.' }

      - name: Run non-hardware Release tests
        shell: pwsh
        run: |
          dotnet test tests/MeetTape.Tests/MeetTape.Tests.csproj --configuration Release --filter 'Category!=Hardware&Category!=LongRunning'
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }

      - name: Run Avalonia Headless scenarios and render snapshots
        shell: pwsh
        env:
          AVALONIA_TELEMETRY_OPTOUT: '1'
        run: |
          dotnet test tests/MeetTape.UiTests/MeetTape.UiTests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'UI tests failed.' }

      - uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: dist/screenshots/*.png

      - name: Publish and check isolated Windows GUI startup
        shell: pwsh
        env:
          AVALONIA_TELEMETRY_OPTOUT: '1'
        run: |
          dotnet publish src/MeetTape/MeetTape.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output dist/publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/Test-Desktop.ps1 -ExecutablePath dist/publish/MeetTape.exe -SkipNativeWindow
          if ($LASTEXITCODE -ne 0) { throw 'Published executable tests failed.' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taskbar-snapshots
          path: dist/desktop-tests/**/taskbar-*.png

  package-smoke:
    runs-on: windows-latest
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Build two local full packages
        shell: pwsh
        run: |
          dotnet tool install vpk --version 1.2.161 --tool-path dist/vpk
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install pinned vpk.' }
          ./tools/Build-Package.ps1 -Version 1.0.0 -VpkPath ./dist/vpk/vpk.exe
          Copy-Item -LiteralPath dist/releases/OriApps.MeetTape-win-Setup.exe -Destination dist/releases/first-Setup.exe
          ./tools/Build-Package.ps1 -Version 1.0.1 -VpkPath ./dist/vpk/vpk.exe
      - name: Test SDK restart, isolated install, update and uninstall
        shell: pwsh
        run: ./tools/Test-Package.ps1 -InstallOnCi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velopack-smoke
          path: |
            dist/releases/*
            dist/package-tests/**
